<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="icon" type="image/jpg" href="/images/title-icon.jpg">
    <title>Staff</title>
</head>

<body class="w-screen h-screen grid grid-cols-5 gap-8 p-4" style="font-family: 'Poppins', sans-serif;">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sideBar :: sidebar}"></div>


    <!-- MAIN CONTENT -->
    <div class="col-span-4 px-6">
        <!-- TABS FOR STAFFS -->
        <div class="flex justify-between items-center py-4">
            <!-- TAB BAR -->
            <nav class="w-full border-b border-gray-200">
                <div class="flex space-x-8 px-6 py-4">
                    <a th:href="@{/admin/staff(role='DOCTOR')}"
                        th:classappend="${selectedRole == 'DOCTOR'} ? 'text-blue-600 border-blue-500 font-medium' : 'text-gray-600 border-gray-300'"
                        class="tab pb-2 border-b-2 hover:text-blue-500 hover:border-blue-500 transition">Doctor</a>
                    <a th:href="@{/admin/staff(role='RECEPTIONIST')}"
                        th:classappend="${selectedRole == 'RECEPTIONIST'} ? 'text-blue-600 border-blue-500 font-medium' : 'text-gray-600 border-gray-300'"
                        class="tab pb-2 border-b-2 hover:text-blue-500 hover:border-blue-500 transition">Receptionist</a>
                </div>
            </nav>

            <button onclick="openModal()"
                class="whitespace-nowrap h-fit px-3 py-1 rounded border-2 border-black hover:border-blue-500 hover:bg-blue-500 hover:text-white hover:font-bold">
                Add Staff
            </button>
        </div>
        <!-- TAB ENDS -->

        <!-- DATA TABLES FOR STAFF -->
        <div class="p-6 overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">ID
                        </th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Name</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Phone</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Experience</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Role Info</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" th:if="${staffList != null}">
                    <tr th:each="staff : ${staffList}"
                        th:onclick="'window.location.href=\'/admin/staff/' + ${staff.ID} + '\';'"
                        class="hover:bg-blue-50 cursor-pointer text-center transition text-sm py-2">
                        <td th:text="${staff.ID}">1</td>
                        <td th:text="${staff.name}">John</td>
                        <td th:text="${staff.phone}">123456</td>
                        <td th:text="${staff.experience != null ? staff.experience + ' years' : 'Not Added'}">123456
                        </td>
                        <td>
                            <span th:switch="${selectedRole}">
                                <span th:case="'DOCTOR'"
                                    th:text="'Specialization: ' + ${staff.specialisation} + ' | License: ' + ${staff.licenseNumber}">
                                </span>
                                <span th:case="'RECEPTIONIST'"
                                    th:text="'Desk: ' + ${staff.desk} + ' | Shift: ' + ${staff.shift}">
                                </span>
                                <span th:case="*">-</span>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- IN CASE OF EMPTY TABLE -->
            <div id="emptyState"
                class="border border-t-0 border-gray-200 rounded-b p-6 flex flex-col items-center justify-center space-y-4"
                th:if="${staffList == null or #lists.isEmpty(staffList)}">
                <div class="flex justify-center items-center">
                    <img src="/images/NotFound.svg" alt="No data illustration" class="w-64 h-auto" />
                </div>
                <p class="text-center text-gray-700 font-medium">
                    We couldn't find anything related to your sessions.
                </p>
            </div>
        </div>
        <!-- DATA TABLE ENDS -->

        <!-- ADD STAFF MODAL -->
        <div id="staffModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white w-full max-w-2xl max-h-[76vh] overflow-y-auto p-6 rounded shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">New Staff</h2>
                    <button onclick="closeModal()">
                        <i class="fa-solid fa-xmark text-xl text-red-600 hover:font-bold cursor-pointer"></i>
                    </button>
                </div>

                <form th:action="@{/admin/staff/create}" method="post" th:object="${staffForm}" id="staffForm" class="space-y-6">
                    <div class="flex items-center gap-4">
                        <div class="w-1/2">
                            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                            <input type="text" id="name" th:field="*{name}" required
                                class="mt-1 px-3 block w-full border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none shadow-sm" />
                        </div>
                        <div class="w-1/2">
                            <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
                            <select id="gender" th:field="*{gender}"
                                class="mt-1 block w-full border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none shadow-sm">
                                <option th:each="g : ${T(com.college.patient_admission.Models.Gender).values()}"
                                    th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-red-500 font-bold text-sm">
                        <div class="w-1/2">
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="w-1/2">
                            <div th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="w-1/2">
                            <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                            <input type="date" id="dob" th:field="*{dob}"
                                class="mt-1 block w-full border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none shadow-sm" />
                        </div>
                        <div class="w-1/2">
                            <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
                            <input type="tel" id="phone" th:field="*{phone}"
                                class="mt-1 block w-full border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none shadow-sm" />
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-red-500 font-bold text-sm">
                        <div class="w-1/2">
                            <div th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                            <div th:if="${#fields.hasGlobalErrors()}">
                                <p class="text-red-500 font-bold text-sm"
                                   th:each="err : ${#fields.globalErrors()}"
                                   th:text="${err}"></p>
                            </div>
                        </div>
                        <div class="w-1/2">
                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" th:field="*{email}" required
                            class="mt-1 block w-full border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none shadow-sm" />
                        <div class="text-red-500 font-bold text-sm" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div>
                        <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                        <input type="text" id="address" th:field="*{address}"
                            class="mt-1 px-3 block w-full shadow-sm border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none" />
                        <div class="text-red-500 font-bold text-sm" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="w-1/2">
                            <label for="qualification"
                                class="block text-sm font-medium text-gray-700">Qualification</label>
                            <input type="text" id="qualification" th:field="*{qualification}"
                                class="mt-1 px-3 block w-full shadow-sm border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none" />
                        </div>

                        <div class="w-1/2">
                            <label for="salary" class="block text-sm font-medium text-gray-700">Salary</label>
                            <input type="number" id="salary" th:field="*{salary}"
                                class="mt-1 px-3 block w-full shadow-sm border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Experience</label>
                            <input type="text" placeholder="e.g. 3 years" th:field="*{experience}"
                                   class="mt-1 px-3 block w-full border-0 border-b-2 border-gray-400 focus:border-blue-600 focus:outline-none shadow-sm" />
                        </div>

                    </div>

                    <div class="text-red-500 font-bold text-sm" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    <div class="text-red-500 font-bold text-sm" th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"></div>

                    <div class="text-center">
                        <p class="font-medium">Select Role</p>
                        <div class="flex justify-center items-center gap-4 mt-2">
                            <button type="button" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                                onclick="selectRole('DOCTOR')">Doctor</button>
                            <button type="button" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600"
                                onclick="selectRole('RECEPTIONIST')">Receptionist</button>
                        </div>
                    </div>
                    <div class="text-red-500 font-bold text-sm" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>

                    <input type="hidden" id="role" th:field="*{role}" />
                    <div id="roleFields" class="mt-4 hidden"></div>
                    <div id="finalSubmitDiv" class="hidden">
                        <button type="submit"
                            class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const shiftValues = /*[[${shifts}]]*/[];
    </script>

    <script th:src="@{/js/admin/staff.js}"></script>

    <!-- <script th:inline="javascript">
        const shouldOpenModal = [[${openModal} ?: false]]; // false by default
        if (shouldOpenModal) {
            openModal(); // ye tabhi chalega jab openModal true ho
    } -->
</script>
</body>

</html>
