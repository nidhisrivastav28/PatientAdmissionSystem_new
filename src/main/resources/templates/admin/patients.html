<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="icon" type="image/jpg" href="/images/title-icon.jpg">
    <title>Patient</title>
</head>
<body class="w-screen h-screen grid grid-cols-5 gap-8 p-4" style="font-family: 'Poppins', sans-serif;">
    <!-- SIDEBAR -->
  <div th:replace="~{/fragments/sideBar :: sidebar}"></div>


    <!-- MAIN CONTENT -->
    <div class="col-span-4 px-6">
        <div class="flex justify-between items-center py-4">
            <p class="font-bold">Patient Details</p>

<!--            <button onclick="openModal()" class="whitespace-nowrap h-fit px-3 py-1 rounded border-2 border-black hover:border-blue-500 hover:bg-blue-500 hover:text-white hover:font-bold">-->
<!--                Add Patient-->
<!--            </button>-->
        </div>

        <!-- DATA TABLES FOR PATIENTS -->
        <div class="p-6 overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Gender</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" th:if="${patients != null}">
				    <tr th:each="patient : ${patients}"
			        th:onclick="'window.location.href=\'/admin/patients/' + ${patient.id} + '/details\';'"
			        class="hover:bg-blue-50 cursor-pointer transition">
					    <td th:text="${patient.id}">1</td>
					    <td th:text="${patient.pname}">John</td>
					    <td th:text="${patient.pphnno}">123456</td>
					    <td th:text="${patient.pgender}">female</td>
					</tr>
      			</tbody>
            </table>
            <!-- IN CASE OF EMPTY TABLE -->
            <div id="emptyState" 
            class="border border-t-0 border-gray-200 rounded-b p-6 flex flex-col items-center justify-center space-y-4"
            th:if="${patients == null or #lists.isEmpty(patients)}">
                <div class="flex justify-center items-center">
                    <img src="/images/NotFound.svg" alt="No data illustration" class="w-64 h-auto" />
                </div>
                <p class="text-center text-gray-700 font-medium">
                    We couldn't find anything related to your patients.
                </p>
            </div>
        </div>
        <!-- DATA TABLE ENDS -->


    </div>
</body>
</html>
