<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <title>Dashboard</title>
</head>
<body class="w-screen h-screen grid grid-cols-5 gap-8 p-4" style="font-family: 'Poppins', sans-serif;">

  <!-- SIDEBAR -->
  <div th:replace="~{fragments/sideBar :: sidebar}"></div>

  <!-- MAIN CONTENT -->
  <div class="col-span-4">
    <!-- WELCOME -->
    <div class="relative w-full h-1/3 min-h-[250px]">
      <img src="/images/Admin.jpg" alt="background" class="absolute inset-0 w-full h-full object-cover rounded-lg"/>
      <div class="absolute inset-0 bg-white/60"></div>

      <div class="relative z-10 px-6 py-2">
        <h3 class="text-lg font-semibold mb-4">Welcome!</h3>
        <h1 class="text-3xl font-bold my-2 doctor-name" th:text="${adminName} + '.'">--</h1>
        <p class="text-sm mb-4 max-w-xl">
          Thanks for joining us. You can monitor daily activities here!!
        </p>
        <button
        th:onclick="|window.location.href='@{/admin/appointments}'|"
        class="bg-blue-600 hover:bg-blue-700 text-white mt-4 px-4 py-2 rounded-md">
          View All Appointments
        </button>
      </div>

      <!-- STATUS BOXES -->
      <div class="flex justify-between px-6 mt-16">
        <div class="w-2/5">
          <h2 class="text-md font-semibold mb-6">Status</h2>
          <div id="status-container" class="grid grid-cols-2 gap-4">
            <div th:each="item : ${statusList}" 
                class="flex items-center justify-between bg-white rounded-xl shadow-md p-4 hover:shadow-lg transition transform hover:-translate-y-1">
                <div>
                    <div class="text-blue-600 text-2xl font-bold mb-2" th:text="${item.value}">0</div>
                    <div class="text-gray-700 text-sm font-medium">
                        <span th:text="${item.label}">Label</span>
                    </div>
                </div>
                <span class="status-icon w-1/2 h-full flex items-center justify-center bg-blue-300/30 rounded">
                    <i th:classappend="${item.label == 'All Doctors' ? 'fa-solid fa-stethoscope' :
                                    item.label == 'All Patients' ? 'fa-solid fa-hospital-user' :
                                    item.label == 'New Booking' ? 'fa-solid fa-bookmark' :
                                    item.label == 'Today Sessions' ? 'fa-solid fa-bed-pulse' :
                                    'fa-solid fa-circle-question'} + ' text-blue-600 text-2xl'"></i>
                </span>
            </div>
          </div>
        </div>

        <div class="w-1/2 h-64 px-6 overflow-y-auto">
          <h2 class="text-md font-semibold mb-4">Today's Sessions</h2>
          <table class="min-w-full divide-y divide-gray-200 border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Doctor Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Patient Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Time</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" th:if="${appointments != null}">
				    <tr th:each="appointment : ${appointments}" class="hover:bg-blue-50 cursor-pointer transition text-center">
					    <td th:text="${appointment.doctor.name}">John</td>
					    <td th:text="${appointment.patient.pname}">--</td>
					    <td th:text="${appointment.from} + ' - ' + ${appointment.to}">14:00 - 14:50</td>
					</tr>
      			</tbody>
            </table>

            <div id="emptyState" 
            class="border border-t-0 border-gray-200 rounded-b p-6 flex flex-col items-center justify-center space-y-4"
            th:if="${appointments == null or #lists.isEmpty(appointments)}">
                <div class="flex justify-center items-center">
                    <img src="/images/NotFound.svg" alt="No data illustration" class="w-20 h-auto" />
                </div>
                <p class="text-center text-gray-700 font-medium">
                    We couldn't find anything related to your sessions.
                </p>
            </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
