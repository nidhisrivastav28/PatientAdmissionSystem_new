<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <title>Dashboard</title>
</head>

<body class="w-screen min-h-screen grid grid-cols-1 md:grid-cols-5 gap-8 p-4"
    style="font-family: 'Poppins', sans-serif;">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"
        class="w-64 bg-white shadow-lg min-h-screen md:relative md:block hidden md:flex z-10"></div>

    <!-- MAIN CONTENT -->
    <div class="col-span-4">
        <!-- TOP SUMMARY CARDS -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

            <!-- Appointments Card -->
            <div class="bg-white shadow-md rounded-xl p-5 flex items-center justify-between hover:shadow-lg transition">
                <div>
                    <p class="text-gray-600 text-sm">Upcoming Appointments</p>
                    <!-- <p th:text="${appointmentCount}"> -->
                    <p class="text-2xl font-bold mt-1">0</p>
                </div>
                <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                    <i class="fa-solid fa-calendar-check text-xl"></i>
                </div>
            </div>

            <!-- Prescriptions Card -->
            <div class="bg-white shadow-md rounded-xl p-5 flex items-center justify-between hover:shadow-lg transition">
                <div>
                    <p class="text-gray-600 text-sm">Prescriptions</p>
                    <!-- <p th:text="${prescriptionCount}"> -->
                    <p class="text-2xl font-bold mt-1">0</p>
                </div>
                <div class="p-3 rounded-full bg-green-100 text-green-600">
                    <i class="fa-solid fa-pills text-xl"></i>
                </div>
            </div>

            <!-- Reports Card -->
            <div class="bg-white shadow-md rounded-xl p-5 flex items-center justify-between hover:shadow-lg transition">
                <div>
                    <p class="text-gray-600 text-sm">Medical Reports</p>
                    <!-- <p th:text="${reportCount}"> -->
                    <p class="text-2xl font-bold mt-1"></p>
                </div>
                <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                    <i class="fa-solid fa-file-medical text-xl"></i>
                </div>
            </div>

            <!-- Bills Card -->
            <div class="bg-white shadow-md rounded-xl p-5 flex items-center justify-between hover:shadow-lg transition">
                <div>
                    <p class="text-gray-600 text-sm">Pending Bills</p>
                    <!-- <p th:text="${pendingBill}"> -->
                    <p class="text-2xl font-bold mt-1">0</p>
                </div>
                <div class="p-3 rounded-full bg-red-100 text-red-600">
                    <i class="fa-solid fa-file-invoice-dollar text-xl"></i>
                </div>
            </div>
        </div>

        <!-- WELCOME -->
        <div class="relative w-full h-1/3 min-h-[250px] mb-8">
            <img src="/images/Receptionist.jpg" alt="background" class="
        absolute inset-0 w-full 
        h-40 sm:h-60 md:h-72 lg:h-full 
        object-cover rounded-lg
    " />
            <div class="absolute inset-0 bg-white/60"></div>

            <div class="relative z-10 px-6 py-2">
                <h3 class="text-lg font-semibold mb-4">Welcome!</h3>
                <h1 class="text-3xl font-bold my-2 doctor-name" th:text="${patient.pname}">--</h1>
                <p class="text-sm mb-4 max-w-xl">
                    Thanks for joining us. You can monitor your daily activities here!!
                </p>
            </div>

            <!-- STATUS BOXES -->
            <div class="bg-white rounded-xl shadow p-6 mt-10 sm:mt-12 lg:mt-16">
                
                <div class="w-full overflow-x-auto">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800">Available Doctors</h2>

                    <table class="min-w-[700px] md:min-w-full border border-gray-200 rounded-lg overflow-hidden">
                        <thead class="bg-blue-600 text-white">
                            <tr>
                                <th class="py-3 px-4 text-left">Doctor Name</th>
                                <th class="py-3 px-4 text-left">Specialization</th>
                                <th class="py-3 px-4 text-left">Experience</th>
                                <th class="py-3 px-4 text-left">Availability</th>
                                <th class="py-3 px-4 text-center">Action</th>
                            </tr>
                        </thead>

                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="doctor : ${doctors}" class="hover:bg-gray-50">
                                <td class="py-3 px-4 font-medium" th:text="'Dr. ' + ${doctor.name}">Dr. Name</td>
                                <td class="py-3 px-4" th:text="${doctor.specialisation}">Specialization</td>
                                <td class="py-3 px-4"
                                    th:text="${doctor.experience != null ? doctor.experience + ' years' : 'Not Added'}">
                                    Experience</td>
                                <td class="py-3 px-4">
                                    <span class="px-3 py-1 bg-green-100 text-green-600 rounded-full text-sm">
                                        Available
                                    </span>
                                </td>
                                <td class="py-3 px-4 text-center">
                                    <a th:href="@{/patient/appointments/{id}(id=${patient.id})}">
                                        <button
                                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                                            Book Appointment
                                        </button>
                                    </a>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>



</body>

</html>
