<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
</head>

<body class="w-screen h-screen grid grid-cols-5 gap-8 p-4 bg-gray-100" style="font-family: 'Poppins', sans-serif;">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}" class="w-64 bg-white shadow-lg min-h-screen fixed md:relative z-10"></div>

    <!-- MAIN CONTENT -->
    <div class="col-span-4 ml-64 md:ml-0 p-8" x-data="{ openModal: false }">

        <!-- PAGE TITLE -->
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-wide">
                My <span class="text-blue-600">Appointments</span>
            </h1>
            <p class="text-gray-500 mt-1">View and manage your appointments easily</p>
        </div>

        <!-- TOP BUTTONS -->
        <div class="flex gap-5 mb-10">
            <!-- Past Appointments -->
            <button class="
                flex items-center gap-3 px-6 py-3 
                bg-white shadow-lg border border-gray-200 
                rounded-xl
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-300
            ">
                <i class="fa-solid fa-clock-rotate-left text-gray-700 text-xl"></i>
                <span class="text-gray-800 font-semibold">Past Appointments</span>
            </button>

            <!-- Request Appointment -->
            <button @click="openModal = true" class="
                flex items-center gap-3 px-6 py-3 
                bg-blue-600 text-white shadow-lg  
                rounded-xl
                hover:bg-blue-700 hover:shadow-xl hover:-translate-y-1
                transition-all duration-300
            ">
                <i class="fa-solid fa-calendar-plus text-white text-lg"></i>
                <span class="font-semibold">Request Appointment</span>
            </button>
        </div>

        <!-- UPCOMING APPOINTMENTS -->
        <div class="bg-white rounded-xl p-10 shadow-lg border border-gray-200 min-h-64">
            <h2 class="text-2xl font-semibold mb-4 text-blue-600">Upcoming Appointments</h2>
            
            <!-- Example: No appointments -->
            <div class="text-center py-10 text-gray-500 text-lg">
                <i class="fa-solid fa-calendar-xmark text-5xl text-gray-400 mb-4"></i>
                <p>No upcoming appointments.</p>
            </div>
        </div>

        <!-- MODAL -->
        <div x-show="openModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
            <div @click.away="openModal = false" class="bg-white rounded-xl p-8 w-full max-w-md shadow-lg relative transform transition-all duration-300">
                <!-- Close Button -->
                <button @click="openModal = false" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>

                <h2 class="text-2xl font-bold mb-4 text-blue-600">Request Appointment</h2>

                <form>
                    <!-- Patient Info -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Patient Name</label>
                        <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" th:value="${patient.pname}" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Email</label>
                        <input type="email" class="w-full border border-gray-300 rounded px-3 py-2" th:value="${patient.pemail}" readonly>
                    </div>

                    <!-- Select Doctor -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Select Doctor</label>
                        <select class="w-full border border-gray-300 rounded px-3 py-2">
                            <option value="">-- Select Doctor --</option>
                            <!-- <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.name}"></option> -->

                        </select>
                    </div>

                    <!-- Appointment Date & Time -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Appointment Date</label>
                        <input type="date" class="w-full border border-gray-300 rounded px-3 py-2">
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Time Slot</label>
                        <select class="w-full border border-gray-300 rounded px-3 py-2">
                            <option value="">-- Select Time --</option>
                            <option>09:00 AM</option>
                            <option>10:00 AM</option>
                            <option>11:00 AM</option>
                            <option>02:00 PM</option>
                            <option>03:00 PM</option>
                        </select>
                    </div>

                    <!-- Reason -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Reason</label>
                        <textarea class="w-full border border-gray-300 rounded px-3 py-2" rows="3" placeholder="Write reason for appointment..."></textarea>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition-colors">
                        Submit Request
                    </button>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
