<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
    <link rel="icon" type="image/jpg" href="/images/title-icon.jpg">
    <title>Appointments</title>
</head>

<body class="w-screen h-screen grid grid-cols-5 gap-8 p-4 bg-gray-100" style="font-family: 'Poppins', sans-serif;">

     <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"
        class="w-64 bg-white shadow-lg min-h-screen md:relative md:block hidden md:flex z-10"></div>

    <!-- MAIN CONTENT -->
     <div class="col-span-4 ml-64 md:ml-0 p-8" x-data="{ openModal:false, openPastModal:false }">

        <!-- PAGE TITLE -->
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-wide">
                My <span class="text-blue-600">Appointments</span>
            </h1>
            <p class="text-gray-500 mt-1">View and manage your appointments easily</p>
        </div>

        <!-- TOP BUTTONS -->
        <div class="flex gap-5 mb-10">
            <!-- Past Appointments -->
            <button @click="openPastModal = true" class="
                flex items-center gap-3 px-6 py-3 
                bg-white shadow-lg border border-gray-200 
                rounded-xl
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-300
            ">
                <i class="fa-solid fa-clock-rotate-left text-gray-700 text-xl"></i>
                <span class="text-gray-800 font-semibold">Past Appointments</span>
            </button>

            <!-- Request Appointment -->
            <button @click="openModal = true" class="
                flex items-center gap-3 px-6 py-3 
                bg-blue-600 text-white shadow-lg  
                rounded-xl
                hover:bg-blue-700 hover:shadow-xl hover:-translate-y-1
                transition-all duration-300
            ">
                <i class="fa-solid fa-calendar-plus text-white text-lg"></i>
                <span class="font-semibold">Request Appointment</span>
            </button>
        </div>

        <!-- SUCCESS MESSAGE -->
        <div th:if="${successMessage}"
            class="mb-6 p-4 bg-green-100 text-green-700 border border-green-300 rounded-lg shadow">
            <p th:text="${successMessage}"></p>
        </div>

        <!-- UPCOMING APPOINTMENTS -->
        <div class="bg-white rounded-xl p-10 shadow-lg border border-gray-200 min-h-64">
            <h2 class="text-2xl font-semibold mb-4 text-blue-600">Upcoming Appointments</h2>

            <!-- Example: No appointments -->
            <div class="text-center py-10 text-gray-500 text-lg">
                <i class="fa-solid fa-calendar-xmark text-5xl text-gray-400 mb-4"></i>
                <p>No upcoming appointments.</p>
            </div>
        </div>

        <!-- MODAL -->
        <div x-show="openModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
            <div @click.away="openModal = false"
                class="bg-white rounded-xl p-8 w-full max-w-md shadow-lg relative transform transition-all duration-300">
                <!-- Close Button -->
                <button @click="openModal = false" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>

                <h2 class="text-2xl font-bold mb-4 text-blue-600">Request Appointment</h2>

                <form th:action="@{/patient/appointments/request}" method="post">

                    <!-- Patient Info (hidden ID for backend) -->
                    <input type="hidden" name="patientId" th:value="${patient.id}">

                    <!-- Select Doctor -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Select Doctor</label>
                        <select name="doctorId" class="w-full border border-gray-300 rounded px-3 py-2" required>
                            <option value="">-- Select Doctor --</option>
                            <option th:each="doc : ${doctors}" th:value="${doc.ID}"
                                th:text="${doc.name + ' - ' + doc.specialisation}">
                            </option>
                        </select>
                    </div>

                    <!-- Appointment Date -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Appointment Date</label>
                        <input type="date" name="appointmentDate"
                            class="w-full border border-gray-300 rounded px-3 py-2" required>
                    </div>

                    <!-- Time Slot -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Time Slot</label>
                        <select name="from" class="w-full border border-gray-300 rounded px-3 py-2" required>
                            <option value="">-- Select Time --</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                        </select>
                    </div>

                    <!-- Reason -->
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-1">Reason</label>
                        <textarea name="reason" class="w-full border border-gray-300 rounded px-3 py-2" rows="3"
                            placeholder="Write reason for appointment..." required></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition-colors">
                        Submit Request
                    </button>
                </form>

            </div>
        </div>
        <!-- PAST APPOINTMENTS MODAL -->
        <div x-show="openPastModal" x-transition
            class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">

            <div @click.away="openPastModal = false" class="bg-white rounded-xl p-6 w-full max-w-4xl shadow-lg">

                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800">Past Appointments</h2>
                    <button @click="openPastModal = false">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full border border-gray-200 rounded-lg">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 text-left">Doctor</th>
                                <th class="px-4 py-2 text-left">Date</th>
                                <th class="px-4 py-2 text-left">Time</th>
                                <th class="px-4 py-2 text-left">Reason</th>
                                <th class="px-4 py-2 text-left">Status</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="app : ${appointments}" class="border-t">
                                <td class="px-4 py-2" th:text="${app.doctor.name}"></td>
                                <td class="px-4 py-2" th:text="${app.appointmentDate}"></td>
                                <td class="px-4 py-2" th:text="${app.from + ' - ' + app.to}"></td>
                                <td class="px-4 py-2" th:text="${app.reason}"></td>
                                <td class="px-4 py-2">
                                    <span th:text="${app.status}" class="px-2 py-1 rounded bg-gray-200 text-sm"></span>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(appointments)}">
                                <td colspan="5" class="text-center py-4 text-gray-500">
                                    No past appointments found
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>



    </div>

</body>

</html>
