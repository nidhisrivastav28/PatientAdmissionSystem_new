<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="/images/title-icon.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <title>Billing & Payments</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
</head>

<body class="w-screen h-screen grid grid-cols-5 gap-8 p-4 bg-gray-100" style="font-family: 'Poppins', sans-serif;">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"
        class="w-64 bg-white shadow-lg min-h-screen fixed md:relative z-10"></div>

    <!-- MAIN CONTENT -->
    <div class="col-span-4 ml-64 md:ml-0 p-8" x-data="{ payModal: false }">

        <!-- PAGE TITLE -->
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-wide">
                Billing & <span class="text-blue-600">Payments</span>
            </h1>
            <p class="text-gray-500 mt-1">View all billing details and payment history</p>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

            <!-- Total Bills -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <p class="text-gray-500">Total Bills</p>
                <h2 class="text-3xl font-bold text-blue-600 mt-2">₹0</h2>
            </div>

            <!-- Pending Payments -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <p class="text-gray-500">Pending Payments</p>
                <h2 class="text-3xl font-bold text-red-500 mt-2">₹0</h2>
            </div>

            <!-- Paid Amount -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <p class="text-gray-500">Paid Amount</p>
                <h2 class="text-3xl font-bold text-green-600 mt-2">₹0</h2>
            </div>

        </div>

        <!-- BILLING TABLE -->
        <div class="bg-white rounded-xl p-10 shadow-lg border border-gray-200">

            <h2 class="text-2xl font-semibold mb-6 text-blue-600">Billing Details</h2>

            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-700">
                        <th class="p-3 text-left">Bill ID</th>
                        <th class="p-3 text-left">Date</th>
                        <th class="p-3 text-left">Amount</th>
                        <th class="p-3 text-left">Status</th>
                        <th class="p-3 text-left">Action</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Example row -->
                    <tr class="border-b">
                        <td class="p-3">BILL-101</td>
                        <td class="p-3">02 Dec 2025</td>
                        <td class="p-3">₹1500</td>

                        <td class="p-3">
                            <span class="px-3 py-1 rounded-full bg-red-100 text-red-600 text-sm">Pending</span>
                        </td>

                        <td class="p-3 flex gap-3">
                            <button class="text-blue-600 hover:underline">Download</button>

                            <button class="text-green-600 hover:underline" @click="payModal = true">
                                Pay Now
                            </button>
                        </td>
                    </tr>

                    <!-- Example row -->
                    <tr class="border-b">
                        <td class="p-3">BILL-102</td>
                        <td class="p-3">20 Nov 2025</td>
                        <td class="p-3">₹800</td>

                        <td class="p-3">
                            <span class="px-3 py-1 rounded-full bg-green-100 text-green-600 text-sm">Paid</span>
                        </td>

                        <td class="p-3">
                            <button class="text-blue-600 hover:underline">Download</button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <!-- PAYMENT MODAL -->
        <div x-show="payModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

            <div @click.away="payModal = false" class="bg-white rounded-xl p-8 w-full max-w-md shadow-xl">

                <h2 class="text-2xl font-bold text-blue-600 mb-4">Complete Payment</h2>

                <p class="text-gray-700 mb-4">
                    You are paying <span class="font-semibold text-green-600">₹1500</span> for Bill #101.
                </p>

                <!-- Payment Method -->
                <label class="block mb-2 text-sm font-semibold text-gray-700">Select Payment Method</label>
                <select class="w-full border px-3 py-2 rounded mb-4">
                    <option>UPI</option>
                    <option>Net Banking</option>
                    <option>Debit / Credit Card</option>
                </select>

                <!-- Pay Button -->
                <button class="
        flex items-center gap-2
        border border-blue-600 
        text-blue-600 
        px-5 py-2 
        rounded-lg 
        hover:bg-blue-600 hover:text-white
        hover:shadow-md hover:-translate-y-0.5
        active:scale-95
        transition-all duration-300
    " @click="payModal = true">
                    <i class="fa-solid fa-money-check-alt text-sm"></i>
                    Pay Now
                </button>



            </div>
        </div>

    </div>

</body>

</html>
